<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elliott Olson</title>
  <meta name="description" content="Personal website of Elliott Olson.">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #16161a;
      --muted: #6b6b76;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101013;
        --fg: #f2f2f4;
        --muted: #8e8e99;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    p {
      margin: 16px 0 0;
      font-size: 1.0625rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Elliott Olson</h1>
    <p>Something new is on the way.</p>
  </main>
</body>
</html>
