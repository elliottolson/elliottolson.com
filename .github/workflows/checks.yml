name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Check links in the site as published
        run: python3 scripts/build.py && python3 scripts/check_links.py
      - name: Check links with drafts included
        run: python3 scripts/build.py --drafts && python3 scripts/check_links.py

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Build the site, drafts included, so the Writing pages are audited too
        run: python3 scripts/build.py --drafts
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
