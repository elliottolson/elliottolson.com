name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the record of the uptime checks, for the Status page
        uses: actions/checkout@v4
        with:
          ref: uptime
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          pip install -r requirements.txt
          python3 scripts/build.py
          test -f dist/index.html
      - name: Note which pages are new
        run: python3 scripts/tell_search_engines.py --find "$RUNNER_TEMP/new-pages.txt"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell search engines about the new pages
        run: python3 scripts/tell_search_engines.py --send "$RUNNER_TEMP/new-pages.txt"
