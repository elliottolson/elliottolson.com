name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the record of the uptime checks, for the Status page
        uses: actions/checkout@v4
        with:
          ref: uptime
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each post's link preview image is drawn here, and kept from one publish to the next until a post changes
      - id: share-images
        uses: actions/cache@v4
        with:
          path: content/writing/share
          key: share-images-${{ hashFiles('content/writing/*.md', 'scripts/make_share_images.py', 'scripts/build.py', 'scripts/fonts/*', 'site/assets/writing.js') }}
      - name: Draw the posts' link preview images
        if: steps.share-images.outputs.cache-hit != 'true'
        # A post without its image borrows the site's, so a failure here shouldn't stop the site being published
        continue-on-error: true
        run: |
          pip install -r requirements.txt playwright==1.49.1
          python3 scripts/make_share_images.py
      - name: Build the site
        run: |
          pip install -r requirements.txt
          python3 scripts/build.py
          test -f dist/index.html
      - name: Note which pages are new
        run: python3 scripts/tell_search_engines.py --find "$RUNNER_TEMP/new-pages.txt"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell search engines about the new pages
        run: python3 scripts/tell_search_engines.py --send "$RUNNER_TEMP/new-pages.txt"
