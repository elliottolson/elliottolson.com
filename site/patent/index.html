<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to the patent</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://patents.google.com/patent/US12657393B1/en">
  <script>
    // Count the visit, then redirect
    try {
      navigator.sendBeacon("https://elliottolson.goatcounter.com/count?p=" + encodeURIComponent("/patent") +
        "&t=" + encodeURIComponent("Short link: patent") + "&r=" + encodeURIComponent(document.referrer) +
        "&rnd=" + Math.random().toString(36).slice(2));
    } catch (error) {}
    location.replace("https://patents.google.com/patent/US12657393B1/en");
  </script>
  <meta http-equiv="refresh" content="0; url=https://patents.google.com/patent/US12657393B1/en">
</head>
<body>
  <p>Redirecting to <a href="https://patents.google.com/patent/US12657393B1/en">the patent</a>.</p>
</body>
</html>
